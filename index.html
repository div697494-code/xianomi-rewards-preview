<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xianomi Concept</title>
    <meta name="description" content="Mobile-first concept landing page preview for Xianomi." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="device-frame">
        <div class="phone-statusbar">
          <span class="carrier">MTN NIGERIA</span>
          <span class="status-icons">
            <span class="signal">◔</span>
            <span class="battery"><span class="charge"></span></span>
          </span>
        </div>

        <div class="app-wrap">
          <div class="app-header">
            <div class="brand-mark">mi</div>
            <h1>Xiaomi</h1>
            <div class="header-actions">
              <button class="icon-button" aria-label="More options">⋮</button>
              <button class="icon-button close" aria-label="Close">×</button>
            </div>
          </div>

          <div class="hero-panel">
            <div class="device-figure left-device">
              <div class="camera-cluster">
                <span></span><span></span><span></span>
              </div>
            </div>
            <div class="device-figure right-device">
              <div class="screen-shape"></div>
            </div>
            <div class="floating-camera"></div>
          </div>

          <div class="title-row">
            <h2>Xiaomi Nigeria</h2>
            <button class="visit-btn">Visit <span>›</span></button>
          </div>

          <div class="action-row">
            <button class="action-btn"><span class="btn-icon share">⇪</span> Share</button>
            <button class="action-btn"><span class="btn-icon save">▣</span> Save</button>
          </div>

          <div class="gallery-row">
            <div class="thumb thumb-one"></div>
            <div class="thumb thumb-two"></div>
            <div class="thumb thumb-three"></div>
          </div>

          <div class="search-row">
            <span class="search-icon">⌕</span>
            <span>xiaomi</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
